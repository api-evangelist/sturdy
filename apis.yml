name: Sturdy
description: >-
  Sturdy is a decentralized liquid money market protocol for on-chain lending and
  borrowing. Sturdy V2 uses a two-tier architecture: a base layer of risk-isolated
  lending pairs, where each siloed market consists of a single lending asset and a
  single collateral asset, and an aggregation layer on top that lets lenders choose
  acceptable collateral types while avoiding liquidity fragmentation. The protocol is
  oracle-agnostic (using RedStone, API3, and eOracle feeds depending on the market),
  is governed by the $STRDY token and the Sturdy DAO, and has been audited by Zellic,
  ChainSecurity, Spearbit, Certik, Code4rena, and Quantstamp. Sturdy is an on-chain
  smart-contract protocol rather than a hosted REST API: its developer surface is the
  published smart contracts, oracle integrations, and the Sturdy Subnet, with no
  first-party web API, SDK, or OpenAPI. This profile was surfaced as a portfolio
  company of Pantera Capital.
